<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>LM TV</title>
<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  background:black;
  color:white;
  font-family:Arial;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
}
h1{font-size:48px;}
p{font-size:22px;}
</style>
</head>
<body>

<h1 id="titulo">LM TV</h1>
<p>Cargando pantalla...</p>

<script>
const pantallas = [
  {
    nombre:"LOGISTICA",
    url:"https://mikis2023.github.io/lm-tv/PantallaLogistica.html",
    tiempo:40000
  },
  {
    nombre:"FINANZAS",
    url:"https://script.google.com/macros/s/AKfycbyPZlEfAveFINBRKi7IeXsqFMZKOpCLY6kMA3KpIqoe5F_ic00T5_xe09SF-gzPq8_E/exec",
    tiempo:40000
  },
  {
    nombre:"UNOA",
    url:"https://script.google.com/macros/s/AKfycbzY-FXZFuWas7Gd2v5GmSQmO5DYIePctbXr7rb2x7SeVCPnSJ34__hYtJPD1CrnF6PKtQ/exec",
    tiempo:40000
  }
];

let actual = Number(localStorage.getItem("lm_tv_actual") || 0);

document.getElementById("titulo").textContent =
  pantallas[actual].nombre;

setTimeout(()=>{
  window.location.href = pantallas[actual].url;
},1000);

actual++;
if(actual >= pantallas.length){
  actual = 0;
}

localStorage.setItem("lm_tv_actual", actual);
</script>

</body>
</html>
