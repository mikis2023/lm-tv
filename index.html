<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>LM TV</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:black;}
iframe{position:absolute;inset:0;width:100vw;height:100vh;border:none;display:none;}
iframe.activo{display:block;}
#nombre{
  position:fixed;right:15px;bottom:15px;z-index:9999;
  background:rgba(0,0,0,.7);color:white;padding:8px 14px;
  border-radius:12px;font-family:Arial;font-weight:bold;
}
</style>
</head>
<body>

<iframe id="p0" class="activo" src="PantallaLogistica.html"></iframe>

<iframe id="p1" src="https://script.google.com/a/macros/lamartinaproducciones.com/s/AKfycbyPZlEfAveFINBRKi7IeXsqFMZKOpCLY6kMA3KpIqoe5F_ic00T5_xe09SF-gzPq8_E/exec"></iframe>

<iframe id="p2" src="https://script.google.com/macros/s/AKfycbx4I8Pkr0h3720ruaS4K9s6OrrK5eykBsu7Sa_wXNmZfhMos9rVLvf1KZM7udDxr_nihA/exec"></iframe>

<div id="nombre">LOGISTICA</div>

<script>
const pantallas = [
  {id:"p0", nombre:"LOGISTICA", tiempo:40000},
  {id:"p1", nombre:"FINANZAS", tiempo:40000},
  {id:"p2", nombre:"UNOA", tiempo:40000}
];

let actual = 0;

function mostrarPantalla(){
  document.querySelectorAll("iframe").forEach(x=>x.classList.remove("activo"));

  const p = pantallas[actual];
  document.getElementById(p.id).classList.add("activo");
  document.getElementById("nombre").textContent = p.nombre;

  setTimeout(()=>{
    actual = (actual + 1) % pantallas.length;
    mostrarPantalla();
  }, p.tiempo);
}

mostrarPantalla();
</script>

</body>
</html>
