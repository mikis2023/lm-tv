<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<title>LM TV</title>

<style>

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:black;
}

iframe{
  position:absolute;
  inset:0;
  width:100vw;
  height:100vh;
  border:none;
  display:none;
}

iframe.activo{
  display:block;
}

#nombre{
  position:fixed;
  right:15px;
  bottom:15px;
  z-index:9999;
  background:rgba(0,0,0,.7);
  color:white;
  padding:8px 14px;
  border-radius:12px;
  font-family:Arial;
  font-weight:bold;
}

</style>
</head>

<body>

<iframe id="p0" class="activo" src="PantallaLogistica.html"></iframe>

<iframe id="p1" src="https://script.google.com/a/macros/lamartinaproducciones.com/s/AKfycbyPZlEfAveFINBRKi7IeXsqFMZKOpCLY6kMA3KpIqoe5F_ic00T5_xe09SF-gzPq8_E/exec"></iframe>

<iframe id="p2" src="https://script.google.com/a/macros/unoasrl.com/s/AKfycbzY-FXZFuWas7Gd2v5GmSQmO5DYIePctbXr7rb2x7SeVCPnSJ34__hYtJPD1CrnF6PKtQ/exec"></iframe>

<div id="nombre">LOGISTICA</div>

<script>

const pantallas = [
  {
    id:"p0",
    nombre:"LOGISTICA",
    tiempo:40000
  },
  {
    id:"p1",
    nombre:"FINANZAS",
    tiempo:40000
  },
  {
    id:"p2",
    nombre:"UNOA",
    tiempo:40000
  }
];

let actual = 0;

function mostrarPantalla(){

  document.querySelectorAll("iframe")
    .forEach(x=>x.classList.remove("activo"));

  const p = pantallas[actual];

  document.getElementById(p.id)
    .classList.add("activo");

  document.getElementById("nombre")
    .textContent = p.nombre;

  setTimeout(()=>{

    actual++;

    if(actual >= pantallas.length){
      actual = 0;
    }

    mostrarPantalla();

  },p.tiempo);
}

mostrarPantalla();

</script>

</body>
</html>
