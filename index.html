<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>LM TV</title>

<style>

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:black;
  font-family:Arial;
}

#pantalla{
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  border:none;
}

#nombre{
  position:fixed;
  right:15px;
  bottom:15px;
  z-index:9999;
  background:rgba(0,0,0,.7);
  color:white;
  padding:8px 14px;
  border-radius:12px;
  font-weight:bold;
}

</style>
</head>

<body>

<iframe id="pantalla"></iframe>

<div id="nombre"></div>

<script>

const pantallas = [

{
  nombre:"LOGISTICA",
  url:"PantallaLogistica.html",
  tiempo:40000
},

{
  nombre:"FINANZAS",
  url:"https://script.google.com/macros/s/AKfycbyPZlEfAveFINBRKi7IeXsqFMZKOpCLY6kMA3KpIqoe5F_ic00T5_xe09SF-gzPq8_E/exec",
  tiempo:40000
},

{
  nombre:"UNOA",
  url:"https://script.google.com/macros/s/AKfycbzY-FXZFuWas7Gd2v5GmSQmO5DYIePctbXr7rb2x7SeVCPnSJ34__hYtJPD1CrnF6PKtQ/exec",
  tiempo:40000
}

];

let actual = Number(localStorage.getItem("lm_tv_actual") || 0);

const iframe = document.getElementById("pantalla");

iframe.src = pantallas[actual].url;

document.getElementById("nombre").textContent =
  pantallas[actual].nombre;

setTimeout(()=>{

  actual++;

  if(actual >= pantallas.length){
    actual = 0;
  }

  localStorage.setItem("lm_tv_actual",actual);

  location.reload();

},pantallas[actual].tiempo);

</script>

</body>
</html>
